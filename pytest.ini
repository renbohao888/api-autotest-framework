[pytest]
testpaths = testcases
pythonpath = .
addopts = -p no:cacheprovider -ra --strict-markers --durations=8 --report-dir=reports -q
# 实时打印框架日志（请求 / 响应 / 关键统计），便于本地排查与 CI 归档
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-5s | %(name)-18s | %(message)s
log_cli_date_format = %H:%M:%S
markers =
    smoke: 冒烟用例：核心链路，提交前必跑
    regression: 回归用例：全量功能验证
    concurrency: 并发与数据一致性用例
    perf: 性能门禁用例（默认不跑，用 -m perf 触发）
    slow: 耗时较长的用例
