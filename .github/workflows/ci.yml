name: api-autotest

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:          # 支持手动触发（可选性能门禁）
    inputs:
      suite:
        description: 执行套件（default / smoke / concurrency / perf / all）
        default: default

jobs:
  api-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行用例（默认：冒烟 + 回归 + 并发，不含性能门禁）
        env:
          ATF_ENV: ci
        run: |
          SUITE="${{ github.event.inputs.suite }}"
          if [ -z "$SUITE" ]; then SUITE=default; fi
          python scripts/run.py "$SUITE"

      - name: 归档测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-report-py${{ matrix.python-version }}
          path: |
            reports/report.html
            reports/summary.json
          if-no-files-found: warn

      - name: 报告摘要
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("reports/summary.json")
          if not path.exists():
              print("未生成 summary.json")
              raise SystemExit(0)
          stats = json.loads(path.read_text(encoding="utf-8"))["stats"]
          print("用例总数 %(total)s ｜ 通过 %(passed)s ｜ 失败 %(failed)s ｜ 跳过 %(skipped)s ｜ 通过率 %(pass_rate)s%%" % stats)
          print("接口调用 %(api_calls)s 次 ｜ 平均 %(api_avg_ms)s ms ｜ P95 %(api_p95_ms)s ms" % stats)
          PY
